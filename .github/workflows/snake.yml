name: Generate Snake Animation

on:
  # Runs automatically once a day so the snake reflects new contributions
  schedule:
    - cron: "0 0 * * *"
  # Lets you trigger it manually from the Actions tab (do this once now)
  workflow_dispatch:
  # Also regenerate whenever you push to main, so it doesn't feel stale
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake SVG
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Vansh-kap-98
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push the generated files to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}